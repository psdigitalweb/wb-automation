services:
  api:
    environment:
      - PROJECT_SECRETS_PREVIOUS_KEY_FILE=/run/secrets/project_secrets_previous_key
    volumes:
      - ${PROJECT_SECRETS_PREVIOUS_KEY_HOST_PATH:?PROJECT_SECRETS_PREVIOUS_KEY_HOST_PATH is required}:/run/secrets/project_secrets_previous_key:ro

  worker:
    environment:
      - PROJECT_SECRETS_PREVIOUS_KEY_FILE=/run/secrets/project_secrets_previous_key
    volumes:
      - ${PROJECT_SECRETS_PREVIOUS_KEY_HOST_PATH:?PROJECT_SECRETS_PREVIOUS_KEY_HOST_PATH is required}:/run/secrets/project_secrets_previous_key:ro

  beat:
    environment:
      - PROJECT_SECRETS_PREVIOUS_KEY_FILE=/run/secrets/project_secrets_previous_key
    volumes:
      - ${PROJECT_SECRETS_PREVIOUS_KEY_HOST_PATH:?PROJECT_SECRETS_PREVIOUS_KEY_HOST_PATH is required}:/run/secrets/project_secrets_previous_key:ro
